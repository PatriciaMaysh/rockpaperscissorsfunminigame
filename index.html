<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <title>Fun mini game</title>
</head>
<body>

    <div class="container">

        <h1> Rock 🪨, Scissor ✂️, Paper 📃

        <p>Fun mini game </p></h1>
    </div>
    
    <div class="btn-onclick">

    <button onclick = "play ('rock')" div class = btnformat>Rock 🪨</button>
    <button onclick = "play ('scissors')" div class = btnformat>Scissors ✂️</button>
    <button onclick = "play ('paper')" div class = btnformat>Paper📃</button>
    
    </div>

    <p id="user"></p>

    <p id="computer"></p>
    
    <h2 id="results" div class="result"></h2>

    <footer class="mt-4 text-center">
        The project was coded by Patricia Maysh and is
        <a href="https://github.com/PatriciaMaysh/echo.git" target="_blank">open-sourced on GitHub</a>
        and
        <a href="#" target="_blank">hosted on Netlify</a>
    </footer>

    
    <script src ="app.js"></script>
</body>
</html>
